<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medidor de Ponches MLB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚾ Medidor de Ponches MLB</h1>
    <p class="subtitle">Ingresa la línea y cuota de la casa, y el modelo te dirá si hay valor</p>
  </header>

  <nav>
    <button class="tab-btn active" onclick="showSection('predicciones')">Predicciones de hoy</button>
    <button class="tab-btn" onclick="showSection('historial')">Historial</button>
  </nav>

  <main>
    <section id="predicciones" class="section active">
      <h2>Jornada del <span id="fecha"></span></h2>
      <div id="tabla-juegos"></div>
    </section>

    <section id="historial" class="section">
      <h2>Historial desde 24/08/2026</h2>
      <div id="tabla-historial"></div>
    </section>
  </main>

  <footer>
    <p>Construida por Francisco Noe Renteria Nevarez</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
