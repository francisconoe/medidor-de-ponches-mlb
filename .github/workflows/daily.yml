name: daily-strikeout-run

# Tres horarios diarios en hora de Hermosillo (UTC-7):
# 08:00 → 15:00 UTC
# 12:45 → 19:45 UTC
# 15:00 → 22:00 UTC
#
# GitHub Actions usa cron en UTC y NO ajusta por horario de verano.
# Hermosillo no tiene horario de verano, así que la conversión es fija (UTC-7).
#
# El run de las 08:00 tiene datos incompletos (lineups proxy, odds parciales).
# El de las 12:45 ya captura lineups confirmadas de juegos nocturnos.
# El de las 15:00 tiene la mejor calidad de datos (casi todo publicado).
on:
  schedule:
    - cron: "0 15 * * *"    # 08:00 Hermosillo
    - cron: "45 19 * * *"   # 12:45 Hermosillo
    - cron: "0 22 * * *"    # 15:00 Hermosillo
  workflow_dispatch:

# Evita solapamiento entre runs si se retrasan
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run daily
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: "1000"
        run: python run_daily.py

      - name: Generate web data
        if: always()
        run: python scripts/generate_site_data.py

      - name: Commit results back
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/predictions/ reports/bets_ledger.csv web/data.json
          if git diff --cached --quiet; then
            echo "No new predictions, ledger changes, or web data to commit."
            exit 0
          fi
          git commit -m "Daily run $(date -u +%Y-%m-%d-%H%M): predictions + settled ledger + web data"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload predictions + ledger + web data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: |
            reports/predictions/
            reports/bets_ledger.csv
            web/data.json
          if-no-files-found: warn